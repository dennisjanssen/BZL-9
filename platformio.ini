; K-VRC desk companion - ESP32-C6 / ST7789 172x320 / LVGL
;
; CORRECTED 2026-09-02: the brief and the first Stage 1 attempt assumed an
; ESP32-S3 board. esptool's chip-detect on first flash reported ESP32-C6 --
; a different architecture (single RISC-V core, no PSRAM, RISC-V toolchain
; not Xtensa). This environment targets the real chip: an ESP32-C6FH4
; (4MB flash, no PSRAM), matching Waveshare's ESP32-C6-LCD-1.47 reference
; design per the marketplace listing text and the vendor demo pin map (see
; Config.h). Board id `esp32-c6-devkitc-1` confirmed to exist in the
; installed pioarduino platform's boards/ directory.
;
; ASSUMPTION: platform-espressif32 (the official PlatformIO registry package)
; has not shipped Arduino-ESP32 core 3.x for a long time, and the pinned
; libraries below (ESP32Async/ESPAsyncWebServer, ESP32Async/AsyncTCP,
; ElegantOTA async mode) as well as the vendor demo's own use of the
; ledcAttach(pin, freq, res) API all require core 3.x. So this pins the
; community "pioarduino" fork instead, which tracks core 3.x releases.
; Confirm this is acceptable before the first build -- it is a third-party
; GitHub-hosted platform package, not the official Espressif/PlatformIO one.
[env:esp32-c6-kvrc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; --- Flash ---
; Wiki: "Onboard 320 KB ROM, 512 KB HP SRAM, 16 KB LP SRAM, and 4 MB flash"
; -- ESP32-C6FH4, no external PSRAM (the C6 has no PSRAM interface at all,
; unlike S2/S3/P4). The base board JSON defaults to 8MB (the real
; Espressif DevKitC-1), overridden here to the actual 4MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; --- Serial ---
; ESP32-C6 has only a USB-Serial-JTAG peripheral (no separate USB-UART
; bridge chip, and no choice of USB-OTG mode like S2/S3 have) -- confirmed
; these two flags are still required on C6 to route Serial over USB and
; have it available from early boot, not implied automatically.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    ; ElegantOTA defaults to a synchronous WebServer; without this it
    ; would silently pull in a second, incompatible web server type
    ; alongside ESPAsyncWebServer.
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -I include
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

; Registry IDs and exact latest-pinned versions confirmed against
; registry.platformio.org on 2026-09-02.
lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.2.28
    esp32async/ESPAsyncWebServer@3.12.0
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
    ayushsharma82/ElegantOTA@3.1.7
